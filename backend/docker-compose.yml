services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16
    container_name: classroom_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_password}
      POSTGRES_DB: ${DB_NAME:-classroom_db}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app_user} -d ${DB_NAME:-classroom_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache Service (OTP & Token Caching)
  redis:
    image: redis:7-alpine
    container_name: classroom_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # (Tuỳ chọn) UI quản lý DB qua Web
  pgadmin:
    image: dpage/pgadmin4
    container_name: classroom_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_me}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pg_data:
  redis_data:
